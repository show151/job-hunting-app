name: CI

on:
    pull_request:
        branches: [main]

jobs:
    backend-check:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
            - run: npm install
            - run: npm run lint
            - run: npx tsc --noEmit
            - run: npm run build

    frontend-check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
            - run: npm install
            - run: npm run lint
            - run: npx tsc --noEmit
            - run: npm run build
